name: promote-release-candidate
# Triggered manually (via gh workflow run) by a maintainer's release-canary
# script once a release-candidate build has run for an hour and been
# manually approved. See maintainer-tools/release-canary/ for that side.
#
# Only one variant (currently nvidia) actually gets canary-tested. This
# workflow promotes that exact tested build to :latest, and also promotes
# the other 2 variants - but from the *same build.yml run* as the tested
# one, not whatever their :release-candidate tag currently points at. That
# distinction matters because build.yml reruns daily (schedule trigger)
# even without new commits, so ":release-candidate" can have moved on to a
# newer, completely untested build by the time someone approves promotion.
on:
  workflow_dispatch:
    inputs:
      tested_image:
        description: "Image ref without tag that was actually canary-tested, e.g. ghcr.io/l0g0ff/kompassos-dx-hwe-nvidia"
        required: true
      tested_digest:
        description: "Manifest digest of the booted release-candidate that was tested, e.g. sha256:..."
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      packages: write # to push the new :latest tags
      actions: read # to read build.yml's run history and job logs below
    env:
      GH_TOKEN: ${{ github.token }}
      # The 3 variants this repo builds, as "recipe file:image ref" pairs.
      # Used to (a) turn tested_image into its recipe's matrix job name and
      # (b) know which other 2 images/jobs to look up once we've found the
      # matching run.
      RECIPE_HWE: "recipe-dx-hwe.yml:ghcr.io/l0g0ff/kompassos-dx-hwe"
      RECIPE_HWE_NVIDIA: "recipe-dx-hwe-nvidia.yml:ghcr.io/l0g0ff/kompassos-dx-hwe-nvidia"
      RECIPE_SURFACE: "recipe-dx-surface.yml:ghcr.io/l0g0ff/kompassos-dx-surface"
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No separate "does this digest exist" check: skopeo copy fails with a
      # clear enough error on its own if tested_digest was mistyped or has
      # been garbage-collected.
      - name: Promote the tested image by its exact digest
        run: |
          skopeo copy --all \
            "docker://${{ inputs.tested_image }}@${{ inputs.tested_digest }}" \
            "docker://${{ inputs.tested_image }}:latest"

      - name: Promote the sibling variants from that same build.yml run
        run: |
          # Every image blue-build pushes carries the git commit it was
          # built from as an OCI label. That narrows down which build.yml
          # run(s) to look at, but doesn't uniquely identify one - the
          # schedule trigger can rerun build.yml for the *same* commit on a
          # later day (e.g. a Fedora base-image update), producing a
          # different digest under the same commit. So a commit match alone
          # isn't proof it's the exact run we want.
          revision=$(skopeo inspect "docker://${{ inputs.tested_image }}@${{ inputs.tested_digest }}" \
            --format '{{ index .Labels "org.opencontainers.image.revision" }}')
          # Derive which matrix job in that run corresponds to tested_image,
          # e.g. ghcr.io/l0g0ff/kompassos-dx-hwe-nvidia -> recipe-dx-hwe-nvidia.yml
          # (build.yml names each matrix job "Build Custom Image (<recipe>)").
          tested_recipe="recipe-dx-${TESTED_IMAGE##*kompassos-dx-}.yml"
          echo "Commit $revision, tested recipe $tested_recipe"

          # Walk successful build.yml runs for that commit, newest first,
          # until we find the one whose tested-variant job actually pushed
          # our exact tested_digest. blue-build's action doesn't expose the
          # pushed digest as a job output, but cosign logs it as
          # "docker-manifest-digest" while signing, so we grep the raw job
          # log for it instead. This is scraping a log line rather than a
          # documented API - if blue-build/cosign ever change that output
          # format, this step starts failing loudly (not silently).
          run_id=""
          for candidate in $(gh run list --workflow=build.yml --limit 50 \
              --json databaseId,headSha,conclusion \
              -q ".[] | select(.headSha==\"$revision\" and .conclusion==\"success\") | .databaseId"); do
            job_id=$(gh run view "$candidate" --json jobs \
              -q ".jobs[] | select(.name==\"Build Custom Image (${tested_recipe})\") | .databaseId")
            [[ -z "$job_id" ]] && continue
            if gh run view --job "$job_id" --log 2>/dev/null | \
                grep -q "\"docker-manifest-digest\":\"${{ inputs.tested_digest }}\""; then
              run_id="$candidate"
              break
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Could not find the build.yml run that produced ${{ inputs.tested_digest }} for $revision"
            exit 1
          fi
          echo "Found run: $run_id"

          # Now that we know the exact run, read the other 2 variants'
          # pushed digest straight from their job in that same run (same
          # log-scraping trick) and promote each by digest - not by copying
          # their current :release-candidate tag, which could point
          # somewhere else entirely by now.
          failed=0
          for entry in "$RECIPE_HWE" "$RECIPE_HWE_NVIDIA" "$RECIPE_SURFACE"; do
            recipe="${entry%%:*}"
            image="${entry##*:}"
            [[ "$image" == "${{ inputs.tested_image }}" ]] && continue # already promoted above

            job_id=$(gh run view "$run_id" --json jobs \
              -q ".jobs[] | select(.name==\"Build Custom Image (${recipe})\") | .databaseId")
            # If job_id is empty (job missing from this run), the gh/grep
            # below just yield an empty digest too - one check covers both
            # "no such job" and "job ran but never pushed" (e.g. it failed).
            digest=$(gh run view --job "$job_id" --log 2>/dev/null | \
              grep -o '"docker-manifest-digest":"sha256:[a-f0-9]*"' | head -n1 | grep -o 'sha256:[a-f0-9]*')
            if [[ -z "$digest" ]]; then
              # Deliberately don't abort the whole promotion for this: if
              # e.g. surface failed to build, hwe/nvidia should still get
              # promoted. We just leave this one image's :latest untouched
              # and fail the job afterwards so it's visible in the Actions UI.
              echo "::error::$image: no successful build for $recipe in run $run_id, leaving :latest untouched"
              failed=1
              continue
            fi

            echo "$image: promoting $digest (same run as the tested build)"
            skopeo copy --all "docker://$image@$digest" "docker://$image:latest"
          done
          if [[ "$failed" == "1" ]]; then
            exit 1
          fi
        env:
          TESTED_IMAGE: ${{ inputs.tested_image }}
