name: promote-release-candidate
# Called by the external Ansible acceptance pipeline after one image variant
# has passed its own upgrade, reboot, and desktop-login checks.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Independently tested image variant"
        required: true
        type: choice
        options:
          - hwe
          - nvidia
          - surface
      tested_digest:
        description: "Manifest digest booted by the tested VM, e.g. sha256:..."
        required: true
        type: string

jobs:
  promote:
    name: Promote ${{ inputs.variant }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: imjasonh/setup-crane@v0.7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image
        id: image
        env:
          VARIANT: ${{ inputs.variant }}
          TESTED_DIGEST: ${{ inputs.tested_digest }}
        run: |
          case "$VARIANT" in
            hwe) image=ghcr.io/l0g0ff/kompassos-dx-hwe ;;
            nvidia) image=ghcr.io/l0g0ff/kompassos-dx-hwe-nvidia ;;
            surface) image=ghcr.io/l0g0ff/kompassos-dx-surface ;;
            *) echo "::error::Unknown variant: $VARIANT"; exit 1 ;;
          esac
          [[ "$TESTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Invalid tested digest"
            exit 1
          }
          echo "name=$image" >> "$GITHUB_OUTPUT"

      # rpm-ostree reports the platform manifest digest, while the
      # release-candidate tag normally points at an OCI index containing that
      # manifest plus its attestation. Preserve the full index when it still
      # contains the tested digest; otherwise promote only the exact manifest
      # that Ansible tested, never a newer release-candidate by accident.
      - name: Promote exact tested image to latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TESTED_DIGEST: ${{ inputs.tested_digest }}
        run: |
          index_digest=$(crane digest "$IMAGE:release-candidate" 2>/dev/null || true)
          if [[ -n "$index_digest" ]] && crane manifest "$IMAGE@$index_digest" |
              jq -e --arg digest "$TESTED_DIGEST" \
                'any(.manifests[]?; .digest == $digest)' >/dev/null; then
            promoted_digest=$index_digest
          else
            promoted_digest=$TESTED_DIGEST
          fi

          crane tag "$IMAGE@$promoted_digest" latest
          [[ "$(crane digest "$IMAGE:latest")" == "$promoted_digest" ]]
          echo "$IMAGE@$promoted_digest promoted to :latest"
