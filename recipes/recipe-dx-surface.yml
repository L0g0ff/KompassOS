---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: kompassos-dx-surface
description: Aurora Developer Experience for Microsoft Surface devices with some extra gravy.
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

# Replaces the default `latest`/timestamp tags with `release-candidate` (see
# .github/workflows/promote.yml for how a build gets promoted to `latest`).
alt-tags:
  - release-candidate

modules:
  - from-file: common-files.yml

  # Surface install needs both repos before common-dnf.yml runs:
  # linux-surface provides the kernel; kompassos provides Fedora-compatible libwacom.
  - type: dnf
    repos:
      files:
        - linux-surface.repo
        - kompassos.repo

  - type: script
    scripts:
      - install_surface-kernel.sh

  - from-file: common-scripts.yml
  - from-file: common-dnf.yml
  - from-file: common-finalize.yml
