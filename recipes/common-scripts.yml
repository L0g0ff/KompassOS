---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: script
    scripts:
      # Locks qt6-* to whatever the base image ships, so later dnf installs
      # can't bump it past the not-yet-rebuilt libplasma/plasma-login-manager
      # (Fedora 44 ABI gap, see the script for detail). Must run first.
      - versionlock_qt6_pin.sh
      - disable_service_tailscale.sh
      - enable_user_ydotool.sh
      - reconfigure_plymouth.sh
      - enable_user_fontcache_refresh.sh
      - set_fix_blurry_wayland_apps.sh
      - set_ssh_unprivileged_ports.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
