---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: kompassos-dx-hwe-nvidia
description: Aurora Developer Experience Nvidia Hardware with some extra gravy.
base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
# Pinned to an Aurora latest build (Fedora 45, kernel 7.3.3). Aurora stable
# 45.20261113.1 still ships kernel 7.2.11, which half-backports the CS35L56
# OT25 DAI series ("CODEC DAI cs35l56-ot25 not registered"): no sound card at
# all on SoundWire/CS35L56 laptops. Switch back to `stable` once Aurora stable
# ships kernel >= 7.2.12. Tag carries quay.expires-after=4w (~2026-12-13), so
# keep this temporary. See issue #109.
image-version: latest-45.20261115.3

# Replaces the default `latest`/timestamp tags with `release-candidate` (see
# .github/workflows/promote.yml for how a build gets promoted to `latest`).
alt-tags:
  - release-candidate

modules:
  - from-file: common-files.yml
  - from-file: common-scripts.yml
  - from-file: common-dnf.yml
  - from-file: common-finalize.yml
